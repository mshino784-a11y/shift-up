<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>シフト希望表</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'Hiragino Kaku Gothic ProN','Meiryo','Yu Gothic',sans-serif;background:#e8eaf0;color:#222;min-height:100vh;font-size:13px;}

header{background:#2c3e6b;color:#fff;padding:9px 14px;display:flex;align-items:center;gap:10px;flex-wrap:wrap;position:sticky;top:0;z-index:200;box-shadow:0 2px 8px rgba(0,0,0,.3);}
header h1{font-size:1rem;font-weight:700;letter-spacing:.04em;white-space:nowrap;}
.hdr-right{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-left:auto;}
.hdr-right select{padding:6px 8px;border-radius:5px;border:none;font-size:.88rem;background:#3d5080;color:#fff;cursor:pointer;}
#saveStatus{font-size:.72rem;opacity:.85;white-space:nowrap;color:#adf;}
.save-status-mobile{display:none;font-size:.75rem;color:#3d8a5c;white-space:nowrap;}
.menuToggle{display:none;background:#3d5080;color:#fff;border:none;border-radius:5px;padding:6px 10px;font-size:.95rem;cursor:pointer;line-height:1;}

/* ── ツールバー：機能グループごとに区切る ── */
.toolbar{background:#fff;border-bottom:2px solid #d0d4e0;padding:8px 14px;display:flex;gap:10px;flex-wrap:wrap;align-items:center;}
.tgroup{display:flex;gap:6px;align-items:center;flex-wrap:wrap;padding:3px 10px;border-radius:8px;background:#f6f7fb;}
.tgroup-label{font-size:.66rem;font-weight:700;color:#8a92aa;letter-spacing:.02em;margin-right:2px;white-space:nowrap;}

.btn{padding:6px 13px;border:none;border-radius:6px;font-size:.8rem;font-weight:700;cursor:pointer;white-space:nowrap;}
.btn:hover{opacity:.85;} .btn:active{transform:scale(.97);}
.btn-blue{background:#4a7fda;color:#fff;}
.btn-teal{background:#2a9d8f;color:#fff;}
.btn-gray{background:#8a94a8;color:#fff;}
.btn-dark{background:#2c3e6b;color:#fff;}
.btn-orange{background:#e07a20;color:#fff;}
.btn-sm{padding:5px 9px;font-size:.74rem;}
.lock-btn{padding:6px 12px;border-radius:6px;font-size:.8rem;font-weight:700;cursor:pointer;border:1.5px solid #4caf7d;background:#e8f4e8;color:#1a6636;}
.lock-btn.on{background:#fde8e8;color:#c0392b;border-color:#e74c3c;}
.sep{width:1px;height:24px;background:#d0d4e0;margin:0 1px;}
.req-wrap{display:flex;align-items:center;gap:5px;font-size:.8rem;color:#555;}
.req-wrap input{width:44px;padding:4px 5px;border:1.5px solid #ccc;border-radius:4px;text-align:center;font-size:.82rem;}

.mode-btn-group{display:flex;border-radius:6px;overflow:hidden;border:1.5px solid #ccc;}
.mode-btn{padding:6px 11px;border:none;font-size:.78rem;font-weight:700;cursor:pointer;background:#fff;color:#666;}
.mode-btn:not(:last-child){border-right:1px solid #ccc;}
.mode-btn.active-x{background:#fde8e8;color:#c0392b;}
.mode-btn.active-o{background:#d5f0e0;color:#1a7a40;}
.mode-btn.active-h{background:#fdf0d5;color:#a5680c;}
.mode-btn.active-b{background:#e4e6f5;color:#3d5080;}

/* ── モバイル：ツールバーをアコーディオン化 ── */
@media (max-width:760px){
  header{padding:8px 12px;gap:6px 10px;}
  header h1{font-size:.9rem;flex:1 1 auto;}
  .hdr-right{width:100%;justify-content:space-between;margin-left:0;gap:6px;}
  .hdr-right select{padding:6px 6px;font-size:.82rem;}
  #saveStatus{display:none;}
  .save-status-mobile{display:inline;}
  .menuToggle{display:inline-flex;align-items:center;gap:4px;margin-left:auto;}
  .toolbar{max-height:0;overflow:hidden;padding:0 12px;border-bottom:none;transition:max-height .25s ease,padding .25s ease;flex-direction:column;align-items:stretch;gap:10px;}
  .toolbar.open{max-height:70vh;padding:12px;border-bottom:2px solid #d0d4e0;overflow-y:auto;}
  .tgroup{width:100%;justify-content:flex-start;}
  .mode-btn-group{width:100%;}
  .mode-btn{flex:1;padding:8px 6px;}
  .req-wrap{width:100%;justify-content:space-between;}
  .sep{display:none;}
  .tgroup{border-top:1px solid #e8eaf2;}
  .tgroup:first-child{border-top:none;}
  .tgroup{padding:8px 10px;}
}

.legend{background:#f8f9fc;border-bottom:1px solid #d8dce8;padding:5px 14px;display:flex;gap:16px;flex-wrap:wrap;align-items:center;font-size:.76rem;color:#555;}
.leg-item{display:flex;align-items:center;gap:4px;}
.leg-dot{width:20px;height:18px;border-radius:3px;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:.85rem;}
.leg-x{background:#fde8e8;color:#c0392b;}
.leg-o{background:#d5f0e0;color:#1a7a40;}
.leg-bl{background:#f7f8fb;color:#bbb;border:1px solid #ddd;}
.leg-off{background:#d0cece;color:#777;}
.leg-h{background:#fdf0d5;color:#a5680c;}

#valBox{margin:8px 14px;padding:9px 13px;border-radius:8px;font-size:.8rem;display:none;}
#valBox.ok{background:#e6f9ee;border:1px solid #4caf7d;color:#1a6636;display:block;}
#valBox.err{background:#fff6f0;border:1px solid #e8a34a;color:#8a4a00;display:block;}
#valBox .vb-head{display:flex;align-items:center;justify-content:space-between;gap:8px;cursor:pointer;font-weight:700;}
#valBox .vb-head .vb-toggle{font-size:.7rem;font-weight:700;color:#a05a00;white-space:nowrap;flex-shrink:0;}
#valBox.ok .vb-head{cursor:default;}
#valBox .vb-detail{display:none;margin-top:8px;padding-top:8px;border-top:1px solid #f0d9b8;flex-wrap:wrap;gap:6px 10px;}
#valBox .vb-detail.open{display:flex;}
#valBox .vb-tag{background:#fff;border:1px solid #f0c896;border-radius:5px;padding:3px 8px;font-size:.75rem;color:#8a4a00;white-space:nowrap;}
#valBox .vb-pending{margin-top:6px;font-size:.76rem;color:#5a6a8a;width:100%;}

.table-outer{overflow:auto;padding:12px 14px 40px;-webkit-overflow-scrolling:touch;max-height:calc(100vh - 230px);}
.table-wrap{display:inline-block;min-width:100%;background:#fff;border-radius:6px;box-shadow:0 2px 10px rgba(0,0,0,.12);overflow:hidden;}
table{border-collapse:collapse;table-layout:fixed;}
.scroll-hint{display:none;font-size:.72rem;color:#888;padding:0 14px;margin-top:-6px;margin-bottom:4px;}
@media (max-width:760px){ .scroll-hint{display:block;} .table-outer{max-height:calc(100vh - 165px);} }

/* 見出し（日付・備考・午前午後の3行）をテーブル内スクロール時も上部に固定する。
   これにより、下にスクロールしてもツールバーのボタンや日付・氏名が常に見える。 */
#tHead{position:sticky;top:0;z-index:40;}

thead th{background:#2c3e6b;color:#fff;font-weight:700;font-size:.74rem;text-align:center;padding:3px 1px;border-right:1px solid #3a507a;white-space:nowrap;vertical-align:middle;}
th.s-no{position:sticky;left:0;z-index:30;background:#1e2d50;width:26px;min-width:26px;}
th.s-name{position:sticky;left:26px;z-index:30;background:#1e2d50;width:96px;min-width:96px;}
th.s-target{position:sticky;right:0;z-index:30;background:#1e2d50;width:54px;min-width:54px;}
th.sat{background:#1e3f7a!important;}
th.sun{background:#7a1c1c!important;}
th.hdr-off{background:#7a7878!important;color:#ddd!important;}
.th-day{font-size:.92rem;display:block;font-weight:800;line-height:1.3;}
.th-wd{font-size:.68rem;display:block;opacity:.85;}

tr.note-row td{background:#f0f4ff;font-size:.62rem;color:#444;text-align:center;padding:1px;border:1px solid #d0d4e0;height:14px;overflow:hidden;white-space:nowrap;cursor:pointer;}
tr.note-row td.s-no,tr.note-row td.s-name{position:sticky;background:#e4e8f4;font-weight:700;z-index:10;cursor:default;}
tr.note-row td.s-no{left:0;}
tr.note-row td.s-name{left:26px;}
tr.note-row td.s-target{position:sticky;right:0;background:#e4e8f4;z-index:10;cursor:default;}
tr.note-row td.nd-off{background:#bfbdbd!important;color:#888;cursor:default;}

tr.ampm-row td{background:#e8ecf5;font-size:.6rem;color:#777;text-align:center;padding:1px;border:1px solid #d0d4e0;height:13px;}
tr.ampm-row td.s-no{position:sticky;left:0;z-index:10;background:#d8dce8;}
tr.ampm-row td.s-name{position:sticky;left:26px;z-index:10;background:#d8dce8;}
tr.ampm-row td.s-target{position:sticky;right:0;z-index:10;background:#d8dce8;}
tr.ampm-row td.ap-off{background:#b8b6b6!important;}
.half-lbl{display:flex;}
.half-lbl span{flex:1;text-align:center;}

tr.data-row td{border:1px solid #d0d4e0;vertical-align:middle;padding:0;}
td.s-no{position:sticky;left:0;z-index:5;background:#f0f2f8;text-align:center;font-weight:700;font-size:.78rem;color:#555;padding:2px;border-right:1px solid #b0b8cc;}
td.s-name{position:sticky;left:26px;z-index:5;background:#f8f9fc;text-align:left;font-weight:600;font-size:.8rem;padding:3px 5px;border-right:2px solid #a0a8c0;white-space:nowrap;display:flex;align-items:center;gap:3px;}
.row-lock-btn{border:none;background:transparent;cursor:pointer;font-size:.82rem;padding:1px 2px;line-height:1;flex-shrink:0;border-radius:4px;}
.row-lock-btn:hover{background:#e4e6f5;}
.row-lock-btn.on{background:#fde8e8;}
.row-lock-btn.on:hover{background:#f9cfcf;}
.row-name-text{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
tr.data-row.row-locked td.s-name{background:#efe4e4;}
tr.data-row.row-locked td.s-no{background:#eee0e0;}
td.s-target{position:sticky;right:0;z-index:5;background:#fffbe6;padding:2px;text-align:center;border-left:2px solid #a0a8c0;}
td.s-target input{width:42px;padding:3px;border:1.5px solid #ccc;border-radius:4px;text-align:center;font-size:.85rem;font-weight:700;background:transparent;}
td.s-target input:focus{outline:none;border-color:#4a7fda;}
tr.data-row:nth-child(even) td.s-name{background:#f2f4fc;}

td.cell-day{min-width:44px;width:44px;padding:0;}
td.cell-day.day-off{background:#d0cece!important;}
.cell-wrap{display:grid;grid-template-columns:1fr 1fr;height:42px;}
.hc{display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:1.05rem;font-weight:700;user-select:none;transition:background .1s;}
.hc.am{border-right:1px dashed #b8bcc8;}
.hc[data-s="0"]{background:#f7f8fb;color:transparent;}
.hc[data-s="1"]{background:#fde8e8;color:#c0392b;}
.hc[data-s="2"]{background:#d5f0e0;color:#1a7a40;}
.hc[data-s="0"]:hover:not(.lk){background:#e4e6f5;}
.hc[data-s="1"]:hover:not(.lk){background:#f9cfcf;}
.hc[data-s="2"]:hover:not(.lk){background:#bde8d0;}
.hc.lk{cursor:default!important;}
.hc.selected{box-shadow:inset 0 0 0 2px #4a7fda;}
.hc.sel-anchor{box-shadow:inset 0 0 0 3px #e07a20;}
.half-cell.sel-anchor{box-shadow:inset 0 0 0 3px #e07a20;}

.half-cell{display:flex;align-items:center;justify-content:center;height:42px;cursor:pointer;font-size:1.1rem;font-weight:700;user-select:none;background:#fdf0d5;color:#a5680c;transition:background .1s;}
.half-cell:hover:not(.lk){background:#fbe3b5;}
.half-cell.lk{cursor:default!important;}
.half-cell.selected{box-shadow:inset 0 0 0 2px #4a7fda;}

tr.count-row td{background:#eef1f8;text-align:center;font-size:.68rem;padding:2px 1px;border:1px solid #cdd0de;color:#444;}
tr.count-row td.s-no{position:sticky;left:0;z-index:10;background:#e0e4f0;font-weight:700;}
tr.count-row td.s-name{position:sticky;left:26px;z-index:10;background:#e0e4f0;font-weight:700;font-size:.72rem;}
tr.count-row td.s-target{position:sticky;right:0;z-index:10;background:#e0e4f0;}
td.cnt-off{background:#bfbdbd!important;}
.cnt-wrap{display:flex;flex-direction:column;gap:1px;}
.cc{padding:1px 3px;border-radius:3px;font-weight:700;font-size:.68rem;}
.cc-ok{background:#c3e6cb;color:#155724;}
.cc-warn{background:#f8d7da;color:#721c24;}
.cc-idle{background:#e2e3e5;color:#555;}

.modal-bg{display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:500;align-items:center;justify-content:center;}
.modal-bg.open{display:flex;}
.modal{background:#fff;border-radius:10px;padding:22px;min-width:320px;max-width:640px;box-shadow:0 8px 32px rgba(0,0,0,.25);}
.modal h3{font-size:.95rem;font-weight:700;margin-bottom:12px;color:#2c3e6b;}
.modal input[type=text]{width:100%;padding:7px 10px;border:1.5px solid #ccc;border-radius:5px;font-size:.9rem;margin-bottom:10px;}
.modal input[type=text]:focus{outline:none;border-color:#4a7fda;}
.modal-btns{display:flex;gap:8px;justify-content:flex-end;margin-top:8px;}
.note-all-row{display:flex;align-items:center;gap:8px;margin-bottom:6px;}
.note-all-row label{width:70px;font-size:.82rem;color:#555;white-space:nowrap;flex-shrink:0;}
.note-all-row input{flex:1;padding:5px 8px;border:1px solid #ccc;border-radius:4px;font-size:.82rem;}
#allNotesList{max-height:420px;overflow-y:auto;padding-right:4px;}

#toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:#2c3e6b;color:#fff;padding:9px 20px;border-radius:7px;font-size:.84rem;z-index:600;box-shadow:0 4px 16px rgba(0,0,0,.22);pointer-events:none;opacity:0;transition:opacity .3s;}
#toast.show{opacity:1;}
</style>
</head>
<body>

<header>
  <h1>📅 シフト希望表</h1>
  <div class="hdr-right">
    <select id="yearSel"></select>年
    <select id="monthSel"></select>月
    <span id="saveStatus">💾 自動保存</span>
    <button class="menuToggle" id="menuToggleBtn" onclick="toggleToolbar()">☰ メニュー</button>
  </div>
</header>

<div class="toolbar" id="toolbar">
  <div class="tgroup">
    <span class="tgroup-label">保存</span>
    <span id="saveStatusMobile" class="save-status-mobile">💾 自動保存</span>
  </div>

  <div class="sep"></div>

  <div class="tgroup">
    <span class="tgroup-label">入力モード</span>
    <div class="mode-btn-group">
      <button class="mode-btn active-x" id="modeXBtn" onclick="setClickMode('x')">❌ ×</button>
      <button class="mode-btn" id="modeOBtn" onclick="setClickMode('o')">⭕ ○</button>
      <button class="mode-btn" id="modeHBtn" onclick="setClickMode('h')">◐ 片方OK</button>
      <button class="mode-btn" id="modeBBtn" onclick="setClickMode('b')">⬜ 空欄</button>
    </div>
  </div>

  <div class="sep"></div>

  <div class="tgroup">
    <span class="tgroup-label">選択・編集</span>
    <button class="lock-btn" id="selBtn" onclick="toggleSelectMode()">🔲 複数選択</button>
    <button class="btn btn-teal" id="applySelBtn" onclick="applyToSelection()" style="display:none;">✅ 選択範囲に適用</button>
    <button class="btn btn-gray" id="clearSelBtn" onclick="clearSelection()" style="display:none;">✕ 選択解除</button>
    <button class="btn btn-orange" id="holBtn" onclick="toggleHolMode()">🏖 休業日設定</button>
    <button class="btn btn-blue" onclick="openAllNotes()">📝 備考編集</button>
  </div>

  <div class="sep"></div>

  <div class="tgroup">
    <span class="tgroup-label">必要人数</span>
    <div class="req-wrap">
      <input type="number" id="reqCount" value="3" min="1" max="20" onchange="validate();updateCounts();">
      <span>人</span>
    </div>
  </div>

  <div class="sep"></div>

  <div class="tgroup">
    <span class="tgroup-label">自動化</span>
    <button class="btn btn-teal" onclick="autoAssign()">✨ 自動割り当て</button>
    <button class="btn btn-gray" onclick="resetMonth()">↩ リセット</button>
  </div>

  <div class="sep"></div>

  <div class="tgroup">
    <span class="tgroup-label">出力</span>
    <button class="btn btn-dark" id="exportXlsxBtn" onclick="exportXLSX()">📊 Excel出力</button>
    <button class="btn btn-gray" onclick="exportCSV()">📥 CSV出力</button>
  </div>
</div>

<div class="legend">
  <strong>凡例：</strong>
  <div class="leg-item"><div class="leg-dot leg-x">×</div>入れない</div>
  <div class="leg-item"><div class="leg-dot leg-o">○</div>入りたい</div>
  <div class="leg-item"><div class="leg-dot leg-bl"></div>どちらでも</div>
  <div class="leg-item"><div class="leg-dot leg-off">休</div>休業日</div>
  <div class="leg-item"><div class="leg-dot leg-h">◐</div>片方OK（未確定）</div>
  <div class="leg-item">🔓/🔒 氏名横のアイコンでその人だけタップ操作を禁止できます</div>
  <span style="color:#aaa;margin-left:8px" id="modeHint">クリック：空欄⇔× ／ 左＝午前・右＝午後</span>
</div>

<div id="valBox"></div>
<div class="scroll-hint">👉 横にスワイプすると日付を確認できます</div>

<div class="table-outer">
  <div class="table-wrap">
    <table id="mainTable">
      <thead id="tHead"></thead>
      <tbody id="tBody"></tbody>
    </table>
  </div>
</div>

<!-- 備考1日編集モーダル -->
<div class="modal-bg" id="noteModal">
  <div class="modal">
    <h3 id="noteModalTitle">備考編集</h3>
    <input type="text" id="noteInput" placeholder="例：会議、おはなし会など">
    <div class="modal-btns">
      <button class="btn btn-gray" onclick="closeNoteModal()">キャンセル</button>
      <button class="btn btn-blue" onclick="saveNote()">保存</button>
    </div>
  </div>
</div>

<!-- 備考一括編集モーダル -->
<div class="modal-bg" id="allModal">
  <div class="modal" style="min-width:480px;">
    <h3>📝 備考一括編集</h3>
    <div id="allNotesList"></div>
    <div class="modal-btns" style="margin-top:12px;">
      <button class="btn btn-gray" onclick="closeAllNotes()">閉じる</button>
    </div>
  </div>
</div>

<div id="toast"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/exceljs/4.4.0/exceljs.min.js"></script>
<script>
/* ── 定数 ── */
const STAFF_DEF = [
  '森 玲子','佐藤 祐子','浅野 ゆり子','加屋野 美紀','椙山 真澄',
  '熊本 和美','髙橋 洋子','西島 紀子','神宮司 智子','篠　智子',
  '金澤 緑','高橋 貴美枝','櫻井 佐和子','島袋 公子','中山 琴美','柳川 たづ江'
];
const WD = ['日','月','火','水','木','金','土'];
const SL = ['','×','○'];

/* ── 状態 ── */
let staffList = [];
let holMode = false;
let noteDay = null;
let store = {};
let clickMode = 'x'; /* 'x' = ×モード（空欄⇔×トグル）, 'o' = ○モード（空欄⇔○トグル）, 'h' = 片方OKモード（空欄⇔◐トグル） */
let selectMode = false;
let selected = new Set(); /* keys of 'si-d' currently selected */
let selAnchor = null; /* {si, d} の始点。nullなら次のタップが始点になる */

/* ── storageラッパー（localStorage が使えない環境に対応） ── */
const memStore = {};
const storage = {
  getItem(k) {
    try { return localStorage.getItem(k); } catch(e) { return memStore[k] ?? null; }
  },
  setItem(k, v) {
    try { localStorage.setItem(k, v); } catch(e) { memStore[k] = v; }
  }
};

/* ── localStorage ラッパー ── */
function lsKey(y,m)  { return 'sft_' + y + '_' + String(m).padStart(2,'0'); }
function lsStaff()   { return 'sft_staff_v2'; }
function lsMode()    { return 'sft_click_mode'; }

function saveMonth(y,m) {
  const k = lsKey(y,m);
  try {
    storage.setItem(k, JSON.stringify(store[k]));
    const t = '✅ ' + new Date().toLocaleTimeString('ja-JP',{hour:'2-digit',minute:'2-digit'});
    const el = document.getElementById('saveStatus');
    const elM = document.getElementById('saveStatusMobile');
    if (el) el.textContent = t;
    if (elM) elM.textContent = t;
  } catch(e) { showToast('⚠️ 保存に失敗しました（容量不足の可能性）'); }
}

function loadMonth(y,m) {
  const k = lsKey(y,m);
  if (store[k]) return store[k];
  try {
    const v = storage.getItem(k);
    store[k] = v ? JSON.parse(v) : {shifts:{},hols:{},notes:{},targets:{},half:{},locks:{}};
  } catch(e) {
    store[k] = {shifts:{},hols:{},notes:{},targets:{},half:{},locks:{}};
  }
  return store[k];
}

function saveStaff() {
  try { storage.setItem(lsStaff(), JSON.stringify(staffList)); } catch(e){}
}
function loadStaff() {
  try { const v = storage.getItem(lsStaff()); if (v) { staffList = JSON.parse(v); return; } } catch(e){}
  staffList = [...STAFF_DEF];
}

function saveClickMode() {
  try { storage.setItem(lsMode(), clickMode); } catch(e){}
}
function loadClickMode() {
  try { const v = storage.getItem(lsMode()); if (v==='x'||v==='o'||v==='h'||v==='b') { clickMode = v; return; } } catch(e){}
  clickMode = 'x';
}

/* ── ヘルパー ── */
function getY()  { return parseInt(document.getElementById('yearSel').value); }
function getM()  { return parseInt(document.getElementById('monthSel').value); }
function getReq(){ return parseInt(document.getElementById('reqCount').value)||3; }
function daysIn(y,m){ return new Date(y,m,0).getDate(); }
function dow(y,m,d){ return new Date(y,m-1,d).getDay(); }

function getDat() {
  const y=getY(),m=getM(),k=lsKey(y,m);
  if (!store[k]) store[k]={shifts:{},hols:{},notes:{},targets:{},half:{},locks:{}};
  if (!store[k].half) store[k].half={};
  if (!store[k].locks) store[k].locks={};
  return store[k];
}

function initDat() {
  const y=getY(),m=getM(),days=daysIn(y,m);
  const dat=getDat();
  staffList.forEach((_,si) => {
    if (!dat.shifts[si]) dat.shifts[si]={};
    if (!dat.half[si]) dat.half[si]={};
    if (dat.targets[si]===undefined) dat.targets[si]='';
    if (dat.locks[si]===undefined) dat.locks[si]=false;
    for (let d=1;d<=days;d++) {
      if (!Array.isArray(dat.shifts[si][d])) dat.shifts[si][d]=[dat.shifts[si][d]||0,0];
      if (dat.shifts[si][d].length<2) dat.shifts[si][d]=[dat.shifts[si][d][0]||0,0];
      if (dat.half[si][d]===undefined) dat.half[si][d]=false;
    }
  });
}

function save() { saveMonth(getY(),getM()); }

/* その日の午前/午後の出勤可能人数と◐(未確定)人数を集計する共通関数 */
function countDay(dat, si_list, d) {
  let am=0, pm=0, half=0;
  si_list.forEach(function(si){
    if (dat.half[si] && dat.half[si][d]) { half++; return; }
    const sh = dat.shifts[si] && dat.shifts[si][d];
    if (sh && sh[0]!==1) am++;
    if (sh && sh[1]!==1) pm++;
  });
  return {am:am, pm:pm, half:half};
}

/* スタッフのインデックス配列 [0,1,2,...] を返す共通ヘルパー */
function staffIdxs() { return staffList.map(function(_,si){ return si; }); }

/* Blobをファイルとしてダウンロードする共通ヘルパー */
function downloadBlob(blob, filename) {
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');
  a.href=url; a.download=filename; a.click();
  URL.revokeObjectURL(url);
}

/* クリックモードの定義（ヒント文言・トースト文言をここに集約） */
const CLICK_MODES = {
  x: { hint:'クリック：空欄⇔× ／ 左＝午前・右＝午後', toast:'❌ ×モードに切り替えました' },
  o: { hint:'クリック：空欄⇔○ ／ 左＝午前・右＝午後', toast:'⭕ ○モードに切り替えました' },
  h: { hint:'クリック：空欄⇔◐（片方OK・未確定）／ 1日1マスに統合されます', toast:'◐ 片方OKモードに切り替えました' },
  b: { hint:'クリック：セルを空欄に戻します（複数選択での一括クリアに便利）', toast:'⬜ 空欄モードに切り替えました' }
};

/* ── モバイル用ツールバー開閉 ── */
function toggleToolbar() {
  const tb = document.getElementById('toolbar');
  const btn = document.getElementById('menuToggleBtn');
  const open = tb.classList.toggle('open');
  btn.textContent = open ? '✕ 閉じる' : '☰ メニュー';
}

/* ── クリックモード切替 ── */
function setClickMode(mode) {
  clickMode = mode;
  saveClickMode();
  const xb=document.getElementById('modeXBtn'), ob=document.getElementById('modeOBtn'), hb=document.getElementById('modeHBtn'), bb=document.getElementById('modeBBtn');
  xb.classList.toggle('active-x', mode==='x');
  ob.classList.toggle('active-o', mode==='o');
  hb.classList.toggle('active-h', mode==='h');
  bb.classList.toggle('active-b', mode==='b');
  document.getElementById('modeHint').textContent = CLICK_MODES[mode].hint;
  showToast(CLICK_MODES[mode].toast);
  if (document.getElementById('tBody').innerHTML) rebuild();
}

/* ── 初期化 ── */
function init() {
  loadStaff();
  loadClickMode();
  setClickMode(clickMode);

  const now = new Date();
  const ySel = document.getElementById('yearSel');
  const mSel = document.getElementById('monthSel');

  for (let y=now.getFullYear()-1; y<=now.getFullYear()+2; y++) {
    const o=document.createElement('option');
    o.value=y; o.textContent=y;
    if (y===now.getFullYear()) o.selected=true;
    ySel.appendChild(o);
  }
  for (let m=1; m<=12; m++) {
    const o=document.createElement('option');
    o.value=m; o.textContent=m;
    if (m===now.getMonth()+1) o.selected=true;
    mSel.appendChild(o);
  }

  ySel.onchange = rebuild;
  mSel.onchange = rebuild;

  loadMonth(now.getFullYear(), now.getMonth()+1);
  initDat();
  rebuild();
}

/* ── テーブル構築 ── */
function rebuild() {
  loadMonth(getY(), getM());
  initDat();
  const y=getY(),m=getM(),days=daysIn(y,m);
  buildHead(y,m,days);
  buildBody(y,m,days);
  validate();
}

function buildHead(y,m,days) {
  const dat=getDat();
  const head=document.getElementById('tHead');
  head.innerHTML='';

  /* 日付行 */
  const r1=document.createElement('tr');
  th(r1,'','s-no'); th(r1,'名前','s-name');
  for (let d=1;d<=days;d++) {
    const w=dow(y,m,d), off=!!dat.hols[d];
    const el=document.createElement('th');
    el.className=off?'hdr-off':(w===6?'sat':w===0?'sun':'');
    el.style.cssText='width:44px;min-width:44px;cursor:pointer;';
    el.innerHTML='<span class="th-day">'+d+'</span><span class="th-wd">'+WD[w]+'</span>';
    el.addEventListener('click',function(day){ return function(){ clickHol(day); }; }(d));
    r1.appendChild(el);
  }
  th(r1,'目標','s-target');
  head.appendChild(r1);

  /* 備考行 */
  const r2=document.createElement('tr');
  r2.className='note-row';
  tdc(r2,'','s-no'); tdc(r2,'備考','s-name');
  for (let d=1;d<=days;d++) {
    const td=document.createElement('td');
    if (dat.hols[d]) { td.className='nd-off'; td.textContent='休'; }
    else {
      td.textContent=dat.notes[d]||'';
      td.addEventListener('click',function(day){ return function(){ openNote(day); }; }(d));
    }
    r2.appendChild(td);
  }
  tdc(r2,'','s-target');
  head.appendChild(r2);

  /* 午前午後行 */
  const r3=document.createElement('tr');
  r3.className='ampm-row';
  tdc(r3,'','s-no'); tdc(r3,'前 後','s-name');
  for (let d=1;d<=days;d++) {
    const td=document.createElement('td');
    if (dat.hols[d]) td.className='ap-off';
    else td.innerHTML='<div class="half-lbl"><span>前</span><span>後</span></div>';
    r3.appendChild(td);
  }
  tdc(r3,'日数','s-target');
  head.appendChild(r3);
}

function th(tr,txt,cls) {
  const el=document.createElement('th');
  el.textContent=txt; el.className=cls; tr.appendChild(el);
}
function tdc(tr,txt,cls) {
  const el=document.createElement('td');
  el.textContent=txt; el.className=cls; tr.appendChild(el);
}

function buildBody(y,m,days) {
  const body=document.getElementById('tBody');
  body.innerHTML='';
  const dat=getDat();

  staffList.forEach(function(name,si){
    const tr=document.createElement('tr');
    tr.className='data-row'+(dat.locks[si]?' row-locked':'');

    /* No */
    const tno=document.createElement('td'); tno.className='s-no'; tno.textContent=si+1; tr.appendChild(tno);
    /* 名前（＋個別ロックアイコン） */
    const tnm=document.createElement('td'); tnm.className='s-name';
    const isLocked = !!dat.locks[si];
    const lockBtn=document.createElement('button');
    lockBtn.type='button';
    lockBtn.className='row-lock-btn'+(isLocked?' on':'');
    lockBtn.textContent=isLocked?'🔒':'🔓';
    lockBtn.title=isLocked?(name+'：ロック中（タップで解除）'):(name+'：タップでロック（この人だけ入力不可に）');
    (function(staffIdx, btn){
      btn.addEventListener('click', function(e){
        e.stopPropagation();
        dat.locks[staffIdx]=!dat.locks[staffIdx];
        save();
        showToast(dat.locks[staffIdx] ? '🔒 '+staffList[staffIdx]+' をロックしました' : '🔓 '+staffList[staffIdx]+' のロックを解除しました');
        rebuild();
      });
    })(si, lockBtn);
    tnm.appendChild(lockBtn);
    const nameSpan=document.createElement('span');
    nameSpan.className='row-name-text';
    nameSpan.textContent=name;
    tnm.appendChild(nameSpan);
    tr.appendChild(tnm);

    /* 日付 */
    for (let d=1;d<=days;d++) {
      const td=document.createElement('td');
      td.className='cell-day';
      if (dat.hols[d]) {
        td.classList.add('day-off');
      } else if (dat.half[si][d]) {
        /* 統合セル（片方OK・未確定） */
        const hcEl=document.createElement('div');
        hcEl.className='half-cell';
        if (isLocked) hcEl.classList.add('lk');
        if (selectMode && selected.has(si+'-'+d)) hcEl.classList.add('selected');
        if (selectMode && selAnchor && selAnchor.si===si && selAnchor.d===d) hcEl.classList.add('sel-anchor');
        hcEl.textContent='◐';
        (function(cell, staffIdx, day){
          cell.addEventListener('click',function(){
            if (dat.locks[staffIdx]) return;
            if (selectMode) { handleSelectClick(staffIdx, day); return; }
            /* どのモードでクリックしても統合解除して通常セル（空欄）に戻す */
            dat.half[staffIdx][day]=false;
            dat.shifts[staffIdx][day]=[0,0];
            save(); rebuild();
          });
        })(hcEl, si, d);
        td.appendChild(hcEl);
      } else {
        const wrap=document.createElement('div');
        wrap.className='cell-wrap';
        [0,1].forEach(function(h){
          const c=document.createElement('div');
          c.className='hc '+(h===0?'am':'pm');
          if (isLocked) c.classList.add('lk');
          if (selectMode && selected.has(si+'-'+d)) c.classList.add('selected');
          if (selectMode && selAnchor && selAnchor.si===si && selAnchor.d===d) c.classList.add('sel-anchor');
          const s=dat.shifts[si][d][h];
          c.dataset.s=s; c.textContent=s===0?'':SL[s];
          (function(cell, staffIdx, day, half){
            cell.addEventListener('click',function(){
              if (dat.locks[staffIdx]) return;
              if (selectMode) { handleSelectClick(staffIdx, day); return; }
              if (clickMode==='h') {
                /* 片方OKモード：このセルを統合セル（◐）に変換。
                   既存の午前/午後の希望は◐（未確定）に置き換わるためクリアする */
                dat.half[staffIdx][day]=true;
                dat.shifts[staffIdx][day]=[0,0];
                save(); rebuild();
                return;
              }
              if (clickMode==='b') {
                /* 空欄モード：常に空欄にする */
                dat.shifts[staffIdx][day][half]=0;
                cell.dataset.s=0; cell.textContent='';
                save(); validate(); updateCounts();
                return;
              }
              const cur=parseInt(cell.dataset.s);
              /* ×モード：空欄⇔× をトグル（○の場合は×に上書き）。○モード：空欄⇔○ をトグル（×の場合は○に上書き） */
              const target = clickMode==='x' ? 1 : 2;
              const nx = (cur===target) ? 0 : target;
              dat.shifts[staffIdx][day][half]=nx;
              cell.dataset.s=nx; cell.textContent=nx===0?'':SL[nx];
              save(); validate(); updateCounts();
            });
          })(c, si, d, h);
          wrap.appendChild(c);
        });
        td.appendChild(wrap);
      }
      tr.appendChild(td);
    }

    /* 目標 */
    const tgt=document.createElement('td'); tgt.className='s-target';
    const inp=document.createElement('input');
    inp.type='number'; inp.min=0; inp.max=days;
    inp.value=dat.targets[si]!==''&&dat.targets[si]!==undefined?dat.targets[si]:'';
    inp.placeholder='日';
    (function(staffIdx, input){
      input.addEventListener('change',function(){ dat.targets[staffIdx]=input.value===''?'':parseInt(input.value); save(); });
    })(si, inp);
    tgt.appendChild(inp); tr.appendChild(tgt);
    body.appendChild(tr);
  });

  /* 集計行 */
  const ctr=document.createElement('tr'); ctr.className='count-row'; ctr.id='cntRow';
  const c0=document.createElement('td'); c0.className='s-no'; ctr.appendChild(c0);
  const c1=document.createElement('td'); c1.className='s-name'; c1.textContent='出勤可能数'; ctr.appendChild(c1);
  for (let d=1;d<=days;d++) {
    const td=document.createElement('td'); td.id='cnt'+d;
    if (dat.hols[d]) td.className='cnt-off';
    ctr.appendChild(td);
  }
  const cr=document.createElement('td'); cr.className='s-target'; ctr.appendChild(cr);
  body.appendChild(ctr);
  updateCounts();
}

function updateCounts() {
  const y=getY(),m=getM(),days=daysIn(y,m),dat=getDat(),req=getReq(),idxs=staffIdxs();
  for (let d=1;d<=days;d++) {
    const td=document.getElementById('cnt'+d);
    if (!td||dat.hols[d]) continue;
    const c = countDay(dat, idxs, d);
    const amShort = req-c.am, pmShort = req-c.pm;
    td.innerHTML='<div class="cnt-wrap">'
      +'<span class="cc '+(c.am===0?'cc-idle':c.am>=req?'cc-ok':'cc-warn')+'" title="午前 必要'+req+'人">前:'+c.am+(amShort>0?'(-'+amShort+')':'')+'</span>'
      +'<span class="cc '+(c.pm===0?'cc-idle':c.pm>=req?'cc-ok':'cc-warn')+'" title="午後 必要'+req+'人">後:'+c.pm+(pmShort>0?'(-'+pmShort+')':'')+'</span>'
      +(c.half>0?'<span class="cc cc-idle">◐:'+c.half+'</span>':'')
      +'</div>';
  }
}

/* ── バリデーション ──
   人数不足は「件数の見出し＋折りたたみ詳細」で表示し、
   長文の羅列で読みにくくならないようにする。 */
let valBoxOpen = false;
function validate() {
  const y=getY(),m=getM(),days=daysIn(y,m),dat=getDat(),req=getReq();
  const el=document.getElementById('valBox'); const errs=[]; let pendingDays=0;
  const idxs = staffIdxs();
  for (let d=1;d<=days;d++) {
    if (dat.hols[d]) continue;
    const c = countDay(dat, idxs, d);
    if (c.half>0) pendingDays++;
    const l=d+'日('+WD[dow(y,m,d)]+')';
    if (c.am<req) errs.push({label:l+' 午前', count:c.am, half:c.half});
    if (c.pm<req) errs.push({label:l+' 午後', count:c.pm, half:c.half});
  }
  const pendingHtml = pendingDays>0
    ? '<div class="vb-pending">◐ 未確定：'+pendingDays+'日（自動割り当てで確定できます）</div>' : '';

  if (errs.length===0) {
    el.className='ok';
    el.innerHTML='<div class="vb-head"><span>✅ 全日程、必要人数（'+req+'人）を充足しています。</span></div>'+pendingHtml;
    valBoxOpen=false;
    return;
  }

  const tags = errs.map(function(e){
    return '<span class="vb-tag">'+e.label+' '+e.count+'人'+(e.half>0?'（+◐'+e.half+'）':'')+'</span>';
  }).join('');

  el.className='err';
  el.innerHTML =
    '<div class="vb-head" onclick="toggleValBox()">'
      +'<span>⚠️ 人数不足：'+errs.length+'件（必要人数 '+req+'人・◐は目安）</span>'
      +'<span class="vb-toggle" id="vbToggleLabel">'+(valBoxOpen?'閉じる ▲':'詳細を見る ▼')+'</span>'
    +'</div>'
    +'<div class="vb-detail'+(valBoxOpen?' open':'')+'" id="vbDetail">'+tags+'</div>'
    +pendingHtml;
}
function toggleValBox() {
  valBoxOpen = !valBoxOpen;
  const detail = document.getElementById('vbDetail');
  const label = document.getElementById('vbToggleLabel');
  if (detail) detail.classList.toggle('open', valBoxOpen);
  if (label) label.textContent = valBoxOpen ? '閉じる ▲' : '詳細を見る ▼';
}

/* ── 複数選択モード（矩形選択：始点タップ→終点タップ） ── */
function toggleSelectMode() {
  selectMode=!selectMode;
  selected.clear();
  selAnchor=null;
  const b=document.getElementById('selBtn');
  const ab=document.getElementById('applySelBtn');
  const cb=document.getElementById('clearSelBtn');
  b.textContent=selectMode?'🔲 選択モード終了':'🔲 複数選択';
  b.className=selectMode?'lock-btn on':'lock-btn';
  ab.style.display=selectMode?'':'none';
  cb.style.display=selectMode?'':'none';
  showToast(selectMode?'始点のセルをタップしてください':'複数選択モードを終了しました');
  rebuild();
}

function handleSelectClick(si, d) {
  if (!selAnchor) {
    /* 1回目のタップ：始点を設定 */
    selAnchor = {si:si, d:d};
    selected.clear();
    selected.add(si+'-'+d);
    showToast('終点のセルをタップしてください（同じセルをもう一度タップで解除）');
    rebuild();
    return;
  }
  if (selAnchor.si===si && selAnchor.d===d) {
    /* 始点を再タップ→選択解除してやり直し */
    selAnchor = null;
    selected.clear();
    showToast('選択を解除しました');
    rebuild();
    return;
  }
  /* 2回目のタップ：終点として矩形範囲を確定 */
  const siMin=Math.min(selAnchor.si,si), siMax=Math.max(selAnchor.si,si);
  const dMin=Math.min(selAnchor.d,d), dMax=Math.max(selAnchor.d,d);
  const dat=getDat();
  selected.clear();
  for (let s=siMin; s<=siMax; s++) {
    for (let dd=dMin; dd<=dMax; dd++) {
      if (dat.hols[dd]) continue; /* 休業日は選択対象外 */
      selected.add(s+'-'+dd);
    }
  }
  selAnchor = null;
  showToast('📐 '+selected.size+'件のセルを範囲選択しました');
  rebuild();
}

function clearSelection() {
  selected.clear();
  selAnchor = null;
  rebuild();
}

function applyToSelection() {
  if (selected.size===0) { showToast('セルが選択されていません'); return; }
  const dat=getDat();
  selected.forEach(function(key){
    const parts=key.split('-'); const si=parseInt(parts[0]), d=parseInt(parts[1]);
    if (dat.hols[d]) return;
    if (clickMode==='h') {
      dat.half[si][d]=true;
      dat.shifts[si][d]=[0,0];
    } else if (clickMode==='b') {
      dat.half[si][d]=false;
      dat.shifts[si][d]=[0,0];
    } else {
      dat.half[si][d]=false;
      const val = clickMode==='x' ? 1 : 2;
      dat.shifts[si][d]=[val,val];
    }
  });
  save();
  const n=selected.size;
  selected.clear();
  selAnchor=null;
  rebuild();
  showToast((clickMode==='b'?'⬜ ':'✅ ')+n+'件のセルに適用しました');
}

/* ── 休業日 ── */
function toggleHolMode() {
  holMode=!holMode;
  const b=document.getElementById('holBtn');
  b.style.background=holMode?'#c0392b':'';
  b.textContent=holMode?'✅ 休業日設定終了':'🏖 休業日設定';
  showToast(holMode?'日付をクリックして休業日を設定/解除してください':'休業日設定を終了しました');
}
function clickHol(d) {
  if (!holMode) return;
  const dat=getDat();
  dat.hols[d]=!dat.hols[d];
  if (dat.hols[d]) staffList.forEach(function(_,si){ dat.shifts[si][d]=[0,0]; if (dat.half[si]) dat.half[si][d]=false; });
  save(); rebuild();
}

/* ── 備考 ── */
function openNote(d) {
  noteDay=d;

  document.getElementById('noteInput').value=dat.notes[d]||'';

function openAllNotes() {
  const y=getY(),m=getM(),days=daysIn(y,m),dat=getDat();

  for (let d=1;d<=days;d++) {

}

/* ── 自動割り当て ── */
function autoAssign() {
  if (!confirm('自動割り当てを実行します。\n×の希望は守り、◐（片方OK）は基本的には空欄と同じ扱いのまま、人数が不足する枠だけ片方に自動確定します（不要なら◐のまま残ります）。目標日数にできるだけ近づけて空欄を補充します（午前のみ・午後のみの勤務は0.5日として計算／人数不足の場合は目標を多少超過してでも必要人数を優先します）。実行しますか？')) return;
  const y=getY(),m=getM(),days=daysIn(y,m),dat=getDat(),req=getReq();
  const idxsAll = staffIdxs();

  /* 目標日数（未設定なら999＝実質無制限として扱う） */
  function targetOf(si) {
    const t = dat.targets[si];
    return (t!==''&&t!==undefined) ? parseInt(t) : 999;
  }

  /* 現在すでに確定している日数をスタッフごとに「日」単位で数える。
     ◐（未確定）はまだ確定していないのでここではカウントしない。
     午前・午後どちらか片方だけの○は0.5日、両方○の日は1日としてカウントする。 */
  const assignedDays = {};
  idxsAll.forEach(function(si){
    let c=0;
    for (let d=1;d<=days;d++){
      if (dat.hols[d]) continue;
      const am = dat.shifts[si][d][0]===2;
      const pm = dat.shifts[si][d][1]===2;
      if (am) c+=0.5;
      if (pm) c+=0.5;
    }
    assignedDays[si]=c;
  });

  /* 「残り必要日数」＝目標－現在の確定日数。負の値は「すでに目標超過」を意味する。 */
  function remaining(si){ return targetOf(si) - assignedDays[si]; }

  /* 全ての未確定枠（日×午前/午後）を洗い出し、不足数が大きい順に並べる。
     ※◐の人はshifts値が[0,0]のままなので、この時点では空欄と見分けがつかない
     　（＝意図的に「空欄と同じ判定」にしている）。 */
  const slots = [];
  for (let d=1; d<=days; d++) {
    if (dat.hols[d]) continue;
    [0,1].forEach(function(h){
      const fixedCount = idxsAll.filter(function(si){ return dat.shifts[si][d][h]===2; }).length;
      const need = req - fixedCount;
      if (need<=0) return;
      slots.push({ d:d, h:h, need:need });
    });
  }
  slots.sort(function(a,b){ return b.need - a.need; }); /* 不足が大きい枠を先に処理 */

  /* ◐（片方OK）の人は「片方だけ」しか働けないので、同じ日に両方の枠へ
     二重に割り当てられないよう、この回で使用済みの (staffIdx-day) を記録する。 */
  const halfUsedInRun = new Set();

  slots.forEach(function(slot){
    const d=slot.d, h=slot.h;

    /* この枠に入れる候補：空欄のまま残っている人（◐で未確定な人も含む）。
       ただし、元◐だった人がこの日ですでに片方の枠で使われていれば
       （変換後はdat.halfがfalseになるため）halfUsedInRunで除外する。 */
    let flex = idxsAll.filter(function(si){
      if (dat.shifts[si][d][h]!==0) return false;
      if (halfUsedInRun.has(si+'-'+d)) return false;
      return true;
    });
    if (flex.length===0) return;

    /* 残り必要日数が多い人を優先。同数なら現在の確定日数が少ない人を優先（さらに公平化） */
    flex.sort(function(a,b){
      const diff = remaining(b) - remaining(a);
      if (diff!==0) return diff;
      return assignedDays[a] - assignedDays[b];
    });

    const need = req - idxsAll.filter(function(si){ return dat.shifts[si][d][h]===2; }).length;
    if (need<=0) return;
    flex.slice(0, need).forEach(function(si){
      dat.shifts[si][d][h]=2;
      assignedDays[si]+=0.5;
      if (dat.half[si] && dat.half[si][d]) {
        /* ◐だった人を実際に確定した場合のみ、片方だけ働く形に変換する。
           不足がなければここには来ないため、◐は空欄同様「基本入れない」まま残る。 */
        dat.half[si][d]=false;
        halfUsedInRun.add(si+'-'+d);
      }
    });
  });

  save(); rebuild();

  /* 目標超過が発生したスタッフがいれば件数を伝える（気づきやすくするため） */
  const overCount = idxsAll.filter(function(si){
    const t = dat.targets[si];
    return (t!==''&&t!==undefined) && assignedDays[si] > parseInt(t);
  }).length;
  const stillPending = idxsAll.some(function(si){
    for (let d=1;d<=days;d++){ if (dat.half[si] && dat.half[si][d]) return true; }
    return false;
  });
  showToast(overCount>0
    ? '✨ 自動割り当てが完了しました（人数確保のため目標超過が'+overCount+'名発生）'
    : '✨ 自動割り当てが完了しました'+(stillPending?'（不足のない◐は未確定のまま残しています）':'（全員、目標日数の範囲内）'));
}

/* ── リセット ── */
function resetMonth() {
  if (!confirm('この月のシフト（○×・◐・休業日・備考）をリセットしますか？\n目標日数は保持されます。')) return;
  const dat=getDat(); dat.shifts={}; dat.hols={}; dat.notes={}; dat.half={};
  selected.clear();
  selAnchor=null;
  initDat(); save(); rebuild(); showToast('リセットしました');
}

/* ── CSV出力 ── */
function exportCSV() {
  const y=getY(),m=getM(),days=daysIn(y,m),dat=getDat();
  const rows=[];
  const t=['','',y+'年　'+m+'月シフト希望表'];
  for(let i=0;i<days*2-1;i++)t.push(''); t.push(''); rows.push(t);
  const dr=['',''];
  for(let d=1;d<=days;d++){dr.push(d,'');} dr.push('目標日数'); rows.push(dr);
  const wr=['',''];
  for(let d=1;d<=days;d++){wr.push(WD[dow(y,m,d)],'');} wr.push(''); rows.push(wr);
  const nr=['','備考'];
  for(let d=1;d<=days;d++){
    if(dat.hols[d]){nr.push('休','');}else{nr.push(dat.notes[d]||'','');}
  } nr.push(''); rows.push(nr);
  const ar=['',''];
  for(let d=1;d<=days;d++){
    if(dat.hols[d]){ar.push('','');}else{ar.push('午前','午後');}
  } ar.push(''); rows.push(ar);
  staffList.forEach(function(name,si){
    const r=[si+1,name];
    for(let d=1;d<=days;d++){
      if(dat.hols[d]){r.push('','');}
      else if(dat.half[si]&&dat.half[si][d]){r.push('◐','◐');}
      else{var am=dat.shifts[si]&&dat.shifts[si][d]?dat.shifts[si][d][0]||0:0;
           var pm=dat.shifts[si]&&dat.shifts[si][d]?dat.shifts[si][d][1]||0:0;
           r.push(am===0?'':SL[am],pm===0?'':SL[pm]);}
    }
    const tg=dat.targets[si]; r.push(tg!==undefined&&tg!==''?tg:''); rows.push(r);
  });
  const cam=['','午前出勤可能数'], cpm=['','午後出勤可能数'], chalf=['','◐未確定数'];
  const idxsCsv = staffIdxs();
  for(let d=1;d<=days;d++){
    if(dat.hols[d]){cam.push('休','');cpm.push('休','');chalf.push('休','');continue;}
    const c = countDay(dat, idxsCsv, d);
    cam.push(c.am,''); cpm.push(c.pm,''); chalf.push(c.half,'');
  }
  cam.push(''); cpm.push(''); chalf.push('');
  rows.push(cam); rows.push(cpm); rows.push(chalf);

  const bom='\uFEFF';
  const csv=rows.map(function(r){ return r.map(function(v){ const s=String(v!=null?v:''); return s.indexOf(',')>=0||s.indexOf('"')>=0?'"'+s.replace(/"/g,'""')+'"':s; }).join(','); }).join('\n');
  const blob=new Blob([bom+csv],{type:'text/csv;charset=utf-8;'});
  downloadBlob(blob, 'シフト希望表_'+y+'年'+m+'月.csv');
  showToast('📥 CSVを出力しました');
}

/* ── Excel出力（写真の手書き帳票レイアウトを再現） ──
   ルール：
   - 各日は「午前」「午後」の2列を持つ
   - 午前と午後の希望が同じ（○○・××・空欄空欄）なら1セルに結合して1つだけ表示
   - 午前と午後が異なる場合は2列に分けてそれぞれ表示（ラベルなし）
   - 休業日は2列結合してグレー表示
*/
async function exportXLSX() {
  if (typeof ExcelJS === 'undefined') {
    showToast('⚠️ Excel出力ライブラリの読み込みに失敗しました（通信環境をご確認ください）');
    return;
  }
  initDat();
  const y=getY(), m=getM(), days=daysIn(y,m), dat=getDat(), req=getReq();

  const FILL = { 1:'FFFDE8E8', 2:'FFD5F0E0' };
  const FONT_COLOR = { 1:'FFC0392B', 2:'FF1A7A40' };
  const HOL_FILL = 'FFD0CECE';
  const HALF_FILL = 'FFFDF0D5';
  const HALF_FONT = 'FFA5680C';
  const NOTE_FILL = 'FFF0F4FF';
  const NOTE_HOL_FILL = 'FFBFBDBD';
  const AMPM_FILL = 'FFE8ECF5';
  const AMPM_HOL_FILL = 'FFB8B6B6';
  const HEADER_NAVY = 'FF2C3E6B';
  const HEADER_DARKBLUE = 'FF1E2D50';

  const wb = new ExcelJS.Workbook();
  const ws = wb.addWorksheet(y+'年'+m+'月', { views:[{ showGridLines:false }] });

  const NAME_COL = 2, FIRST_DAY_COL = 3;
  const dcol = (d) => FIRST_DAY_COL + (d-1)*2;
  const targetCol = dcol(days+1);

  ws.getColumn(1).width = 4.5;
  ws.getColumn(2).width = 14;
  for (let d=1; d<=days; d++) {
    ws.getColumn(dcol(d)).width = 3.4;
    ws.getColumn(dcol(d)+1).width = 3.4;
  }
  ws.getColumn(targetCol).width = 7.5;

  const thin = { style:'thin', color:{argb:'FFB0B8CC'} };
  const border = { top:thin, bottom:thin, left:thin, right:thin };
  const center = { horizontal:'center', vertical:'middle' };

  /* 行1：年・月見出し */
  ws.mergeCells(1, NAME_COL, 1, FIRST_DAY_COL+1);
  const yCell = ws.getCell(1, NAME_COL);
  yCell.value = y+'年'; yCell.font = { name:'Meiryo', size:16, bold:true }; yCell.alignment = center;
  const titleEndCol = Math.min(dcol(8), targetCol-1);
  ws.mergeCells(1, FIRST_DAY_COL+2, 1, titleEndCol);
  const tCell = ws.getCell(1, FIRST_DAY_COL+2);
  tCell.value = m+'月シフト希望表'; tCell.font = { name:'Meiryo', size:22, bold:true, underline:true }; tCell.alignment = center;
  ws.getRow(1).height = 30;

  const ROW_DAY=2, ROW_WD=3, ROW_NOTE=4, ROW_AMPM=5, DATA_START=6;

  /* row(固定行)のc0〜c0+1をマージし、値・中央寄せ・フォントを設定する共通ヘルパー */
  function setMergedCell(row, c0, value, font, fillArgb) {
    ws.mergeCells(row, c0, row, c0+1);
    const cell = ws.getCell(row, c0);
    cell.value = value; cell.alignment = center; cell.font = font;
    if (fillArgb) cell.fill = { type:'pattern', pattern:'solid', fgColor:{argb:fillArgb} };
    return cell;
  }

  for (let d=1; d<=days; d++) {
    const c0 = dcol(d);
    const isHol = !!dat.hols[d];
    const hdrColor = isHol ? 'FF666666' : HEADER_DARKBLUE;

    setMergedCell(ROW_DAY, c0, d, { name:'Meiryo', size:11, bold:true, color:{argb:hdrColor} }, isHol?HOL_FILL:null);
    setMergedCell(ROW_WD, c0, WD[dow(y,m,d)], { name:'Meiryo', size:9, bold:true, color:{argb:hdrColor} }, isHol?HOL_FILL:null);
    setMergedCell(ROW_NOTE, c0, isHol?'休':(dat.notes[d]||''), { name:'Meiryo', size:7, color:{argb:'FF555555'} }, isHol?NOTE_HOL_FILL:NOTE_FILL);

    if (isHol) {
      ws.mergeCells(ROW_AMPM, c0, ROW_AMPM, c0+1);
      ws.getCell(ROW_AMPM, c0).fill = { type:'pattern', pattern:'solid', fgColor:{argb:AMPM_HOL_FILL} };
    } else {
      const ac = ws.getCell(ROW_AMPM, c0), pc = ws.getCell(ROW_AMPM, c0+1);
      ac.value = '前'; pc.value = '後';
      [ac,pc].forEach(function(cell){
        cell.font = { name:'Meiryo', size:6, color:{argb:'FF777777'} };
        cell.alignment = center;
        cell.fill = { type:'pattern', pattern:'solid', fgColor:{argb:AMPM_FILL} };
      });
    }
  }
  ws.getRow(ROW_DAY).height = 18;
  ws.getRow(ROW_WD).height = 18;
  ws.getRow(ROW_NOTE).height = 13;
  ws.getRow(ROW_AMPM).height = 11;

  /* 名前・No見出し */
  ws.mergeCells(ROW_DAY, 1, ROW_AMPM, 1);
  const noH = ws.getCell(ROW_DAY,1); noH.value=''; noH.fill={type:'pattern',pattern:'solid',fgColor:{argb:HEADER_NAVY}};
  ws.mergeCells(ROW_DAY, 2, ROW_AMPM, 2);
  const nameH = ws.getCell(ROW_DAY,2); nameH.value='名前'; nameH.alignment=center;
  nameH.font={name:'Meiryo',size:10,bold:true,color:{argb:'FFFFFFFF'}};
  nameH.fill={type:'pattern',pattern:'solid',fgColor:{argb:HEADER_NAVY}};

  /* 目標列見出し */
  ws.mergeCells(ROW_DAY, targetCol, ROW_AMPM, targetCol);
  const tgtH = ws.getCell(ROW_DAY, targetCol);
  tgtH.value = '目標\n日数'; tgtH.alignment = { horizontal:'center', vertical:'middle', wrapText:true };
  tgtH.font = { name:'Meiryo', size:9, bold:true, color:{argb:'FFFFFFFF'} };
  tgtH.fill = { type:'pattern', pattern:'solid', fgColor:{argb:HEADER_NAVY} };

  /* スタッフ行 */
  staffList.forEach(function(name, si) {
    const r = DATA_START + si;
    const noC = ws.getCell(r,1); noC.value=si+1; noC.alignment=center; noC.font={name:'Meiryo',size:9};
    const nmC = ws.getCell(r,2); nmC.value=name; nmC.font={name:'Meiryo',size:10,bold:true}; nmC.alignment={vertical:'middle'};

    for (let d=1; d<=days; d++) {
      const c0 = dcol(d);
      if (dat.hols[d]) {
        ws.mergeCells(r, c0, r, c0+1);
        ws.getCell(r,c0).fill = { type:'pattern', pattern:'solid', fgColor:{argb:HOL_FILL} };
        continue;
      }
      if (dat.half[si] && dat.half[si][d]) {
        ws.mergeCells(r, c0, r, c0+1);
        const hCell = ws.getCell(r, c0);
        hCell.value = '◐'; hCell.alignment = center;
        hCell.font = { name:'Meiryo', size:12, bold:true, color:{argb: HALF_FONT} };
        hCell.fill = { type:'pattern', pattern:'solid', fgColor:{argb: HALF_FILL} };
        continue;
      }
      const am = dat.shifts[si][d][0], pm = dat.shifts[si][d][1];
      if (am === pm) {
        ws.mergeCells(r, c0, r, c0+1);
        const cell = ws.getCell(r, c0);
        cell.value = SL[am]; cell.alignment = center;
        cell.font = { name:'Meiryo', size:12, bold:true, color:{argb: FONT_COLOR[am]||'FF000000'} };
        if (FILL[am]) cell.fill = { type:'pattern', pattern:'solid', fgColor:{argb:FILL[am]} };
      } else {
        [[c0,am],[c0+1,pm]].forEach(function(pair){
          const cell = ws.getCell(r, pair[0]);
          cell.value = SL[pair[1]]; cell.alignment = center;
          cell.font = { name:'Meiryo', size:10, bold:true, color:{argb: FONT_COLOR[pair[1]]||'FF000000'} };
          if (FILL[pair[1]]) cell.fill = { type:'pattern', pattern:'solid', fgColor:{argb:FILL[pair[1]]} };
        });
      }
    }
    const tg = dat.targets[si];
    const tgC = ws.getCell(r, targetCol);
    tgC.value = (tg!==undefined && tg!=='') ? tg+'日' : '';
    tgC.alignment = center; tgC.font = { name:'Meiryo', size:10, bold:true };

    for (let c=1; c<=targetCol; c++) ws.getCell(r,c).border = border;
    ws.getRow(r).height = 20;
  });

  /* 出勤可能数集計行（午前・午後それぞれ表示、結合なし） */
  const idxsXlsx = staffIdxs();
  const cntRow = DATA_START + staffList.length;
  ws.mergeCells(cntRow, 1, cntRow, 2);
  const cntLbl = ws.getCell(cntRow, 1);
  cntLbl.value = '出勤可能数'; cntLbl.alignment = center;
  cntLbl.font = { name:'Meiryo', size:9, bold:true };
  cntLbl.fill = { type:'pattern', pattern:'solid', fgColor:{argb:'FFE0E4F0'} };

  for (let d=1; d<=days; d++) {
    const c0 = dcol(d);
    if (dat.hols[d]) {
      ws.mergeCells(cntRow, c0, cntRow, c0+1);
      ws.getCell(cntRow, c0).fill = { type:'pattern', pattern:'solid', fgColor:{argb:HOL_FILL} };
      continue;
    }
    const c = countDay(dat, idxsXlsx, d);
    [[c0,c.am],[c0+1,c.pm]].forEach(function(pair){
      const cell = ws.getCell(cntRow, pair[0]);
      cell.value = c.half>0 ? pair[1]+'(+◐'+c.half+')' : pair[1];
      cell.alignment = center;
      cell.font = { name:'Meiryo', size:9, bold:true, color:{argb: pair[1]>=req?'FF155724':(pair[1]===0?'FF555555':'FF721C24')} };
      cell.fill = { type:'pattern', pattern:'solid', fgColor:{argb: pair[1]===0?'FFE2E3E5':(pair[1]>=req?'FFC3E6CB':'FFF8D7DA')} };
    });
  }
  for (let c=1; c<=targetCol; c++) ws.getCell(cntRow,c).border = border;
  ws.getRow(cntRow).height = 18;

  /* 表示・印刷設定 */
  ws.views = [{ state:'frozen', xSplit:2, ySplit:ROW_AMPM, showGridLines:false }];
  ws.pageSetup = { orientation:'landscape', fitToPage:true, fitToWidth:1, fitToHeight:0 };

  const buf = await wb.xlsx.writeBuffer();
  const blob = new Blob([buf], { type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' });
  downloadBlob(blob, 'シフト希望表_'+y+'年'+m+'月.xlsx');
  showToast('📊 Excelを出力しました');
}

/* ── トースト ── */
var toastT=null;
function showToast(msg) {
  const el=document.getElementById('toast');
  el.textContent=msg; el.classList.add('show');
  if(toastT) clearTimeout(toastT);
  toastT=setTimeout(function(){ el.classList.remove('show'); },2800);
}

/* ── キーボード ── */
document.addEventListener('keydown',function(e){
  if(e.key==='Enter'&&document.getElementById('noteModal').classList.contains('open'))saveNote();
  if(e.key==='Escape'){closeNoteModal();closeAllNotes();}
});

/* ── PC幅に戻った時、モバイル用の開閉状態をリセット ── */
window.addEventListener('resize', function(){
  if (window.innerWidth > 760) {
    const tb = document.getElementById('toolbar');
    const btn = document.getElementById('menuToggleBtn');
    if (tb) tb.classList.remove('open');
    if (btn) btn.textContent = '☰ メニュー';
  }
});

/* ── 起動 ── */
init();
</script>
